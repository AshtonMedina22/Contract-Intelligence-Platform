[project]
name = "lp-processor"
version = "0.0.1"
description = "L&P document processing service (Phase 4+)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openpyxl>=3.1.5",
  "pypdf>=5.1.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "supabase>=2.10.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lp_processor = ["routing_policy.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
